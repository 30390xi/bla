    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="282" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#fca5a5">
      ❌ BEFORE BLA — Unprotected App vs. REA
    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ rea analyze-javascript-application ./notion-app.asar --json</text>
    <text x="20" y="98" class="mono" font-size="12" fill="#f87171">▶ [REA Engine] Static &amp; Semantic Pass:</text>
    <text x="32" y="120" class="mono" font-size="12" fill="#e2e8f0">• parse_status:              <tspan fill="#ef4444" font-weight="700">"complete"</tspan></text>
    <text x="32" y="140" class="mono" font-size="12" fill="#e2e8f0">• examination.status:        <tspan fill="#ef4444" font-weight="700">"complete"</tspan></text>
    <text x="32" y="160" class="mono" font-size="12" fill="#e2e8f0">• semantic_resource_limits:  <tspan fill="#94a3b8">[] (0 limits hit)</tspan></text>
    <text x="32" y="180" class="mono" font-size="12" fill="#e2e8f0">• electron.ipc[0].channel:   <tspan fill="#fbbf24">"notion:clipboard:write-rich"</tspan></text>
    <text x="32" y="200" class="mono" font-size="12" fill="#e2e8f0">• IPC Main &lt;-&gt; Preload:      <tspan fill="#ef4444" font-weight="700">100% Uniquely Paired!</tspan></text>
    <text x="32" y="220" class="mono" font-size="12" fill="#e2e8f0">• Source Maps:               <tspan fill="#ef4444">Original TypeScript Recovered</tspan></text>

    <line x1="20" y1="240" x2="544" y2="240" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="266" class="mono" font-size="12" fill="#f87171">▶ [Attacker Coding Agent] Investigation Trace:</text>
    <text x="32" y="290" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 1] Called analyze_javascript_application -&gt; 3 modules</text>
    <text x="32" y="310" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 2] Called trace_application_feature("notionClipboard")</text>
    <text x="32" y="330" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 3] Extracted exact preload -&gt; IPC -&gt; main handler</text>
    <text x="32" y="350" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 4] Generated 1:1 working clone &amp; passed unit tests</text>

    <!-- Verdict Card -->
