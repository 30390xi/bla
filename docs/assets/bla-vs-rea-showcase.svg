<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="burnBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .blink { animation: blinkAnim 1.1s infinite; }
      .pulse-border { animation: pulseBorder 2.2s infinite ease-in-out; }
      .meter-fill { animation: meterGrow 4s infinite ease-out; }
      @keyframes blinkAnim {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.25; }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 1; }
        50% { stroke-opacity: 0.45; }
      }
      @keyframes meterGrow {
        0% { width: 40px; }
        70%, 100% { width: 488px; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="650" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header -->
  <text x="600" y="38" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#f8fafc">
    ⚔️ SIDE-BY-SIDE LIVE SHOWCASE: <tspan fill="#f87171">morluto/rea</tspan> BEFORE vs. AFTER <tspan fill="#2dd4bf">npx bla-shield protect</tspan>
  </text>

  <!-- ==================== LEFT SCREEN: BEFORE BLA ==================== -->
  <g transform="translate(24, 58)">
    <rect width="564" height="568" rx="12" fill="url(#panelBg)" stroke="#ef4444" stroke-width="1.8" />
    <!-- Window Bar -->
    <rect width="564" height="38" rx="12" fill="#1f1215" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="282" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#fca5a5">
      ❌ BEFORE BLA — Unprotected App vs. REA
    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ rea analyze-javascript-application ./notion-app.asar --json</text>
    <text x="20" y="96" class="mono" font-size="12" fill="#f87171">▶ [REA Engine] Static, Semantic &amp; Binary Pass:</text>
    <text x="32" y="118" class="mono" font-size="12" fill="#e2e8f0">• parse_status:              <tspan fill="#ef4444" font-weight="700">"complete"</tspan></text>
    <text x="32" y="138" class="mono" font-size="12" fill="#e2e8f0">• examination.status:        <tspan fill="#ef4444" font-weight="700">"complete"</tspan></text>
    <text x="32" y="158" class="mono" font-size="12" fill="#e2e8f0">• semantic_resource_limits:  <tspan fill="#94a3b8">[] (0 limits hit)</tspan></text>
    <text x="32" y="178" class="mono" font-size="12" fill="#e2e8f0">• electron.ipc[0].channel:   <tspan fill="#fbbf24">"notion:clipboard:write-rich"</tspan></text>
    <text x="32" y="198" class="mono" font-size="12" fill="#e2e8f0">• Electron Fuses (RunAsNode):<tspan fill="#ef4444" font-weight="700">"honored" (--inspect OPEN!)</tspan></text>
    <text x="32" y="218" class="mono" font-size="12" fill="#e2e8f0">• SQLite &amp; Safetensors:      <tspan fill="#ef4444">All tables &amp; tensors dumped</tspan></text>

    <line x1="20" y1="236" x2="544" y2="236" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="262" class="mono" font-size="12" fill="#f87171">▶ [Attacker Coding Agent] Investigation Trace:</text>
    <text x="32" y="286" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 1] Called analyze_javascript_application -&gt; 3 modules</text>
    <text x="32" y="306" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 2] Called trace_application_feature("notionClipboard")</text>
    <text x="32" y="326" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 3] Extracted exact preload -&gt; IPC -&gt; main + SQLite schema</text>
    <text x="32" y="346" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 4] Generated 1:1 working clone &amp; passed unit tests</text>

    <!-- Verdict Card -->
    <rect x="20" y="372" width="524" height="176" rx="10" fill="#2a1215" stroke="#dc2626" stroke-width="1.5" />
    <text x="38" y="400" class="mono" font-size="14" font-weight="800" fill="#f87171">⚠️ ATTACKER OUTCOME: FULL RECONSTRUCTION</text>
    <text x="38" y="426" class="mono" font-size="13" fill="#fecaca">• Time to Clone Core Logic:   <tspan font-weight="800" fill="#ffffff">38 seconds</tspan></text>
    <text x="38" y="450" class="mono" font-size="13" fill="#fecaca">• Attacker Token Consumption: <tspan font-weight="800" fill="#ffffff">4,800 tokens (5 MCP calls)</tspan></text>
    <text x="38" y="474" class="mono" font-size="13" fill="#fecaca">• Attacker Claude API Bill:   <tspan font-weight="800" fill="#fbbf24">$0.20 USD</tspan></text>
    <text x="38" y="498" class="mono" font-size="12" fill="#fca5a5">• Token Burn Meter:</text>
    <rect x="38" y="510" width="488" height="14" rx="7" fill="#0f172a" />
    <rect x="38" y="510" width="18" height="14" rx="7" fill="#ef4444" />
  </g>

  <!-- ==================== RIGHT SCREEN: AFTER BLA ==================== -->
  <g transform="translate(612, 58)">
    <rect width="564" height="568" rx="12" fill="url(#panelBg)" stroke="#14b8a6" stroke-width="2" class="pulse-border" />
    <!-- Window Bar -->
    <rect width="564" height="38" rx="12" fill="#062c28" />
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="282" y="24" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#5eead4">
      🛡️ AFTER `npx bla-shield protect` — REA Blinded &amp; Bankrupted
    </text>

    <!-- Terminal Lines -->
    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ rea analyze-javascript-application ./notion-app.shielded.asar</text>
    <text x="20" y="96" class="mono" font-size="12" fill="#2dd4bf">▶ [REA Engine] Static, Semantic &amp; Container Budgets Broken:</text>
    <text x="32" y="118" class="mono" font-size="12" fill="#e2e8f0">• parse_status / examination:<tspan fill="#2dd4bf" font-weight="700">"partial" / "limited"</tspan></text>
    <text x="32" y="138" class="mono" font-size="11.5" fill="#fde047">• JS limits: ["alias-selections","primitive-bytes","primitive-candidates","getter-expansion"]</text>
    <text x="32" y="158" class="mono" font-size="12" fill="#e2e8f0">• electron.ipc[0].channel:   <tspan fill="#2dd4bf" font-weight="700">null (dynamic-findings!)</tspan></text>
    <text x="32" y="178" class="mono" font-size="12" fill="#e2e8f0">• ElectronFuseReader:        <tspan fill="#fde047" font-weight="700">ABORT (&gt;32 sentinels capacity!)</tspan></text>
    <text x="32" y="198" class="mono" font-size="12" fill="#e2e8f0">• Rust / Dart / Model Caps:  <tspan fill="#fde047" font-weight="700">ABORT (&gt;64 hashes / &gt;32 nesting!)</tspan></text>
    <text x="32" y="218" class="mono" font-size="12" fill="#e2e8f0">• SQLite / CDP Runtime:      <tspan fill="#2dd4bf">Generated-Col Trap + Truman Honeypot</tspan></text>

    <line x1="20" y1="236" x2="544" y2="236" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="262" class="mono" font-size="12" fill="#2dd4bf">▶ [Attacker Coding Agent] Trapped in BLA Tarpit Loop:</text>
    <text x="32" y="286" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 18] Paging 118 decoy obligation nodes (_verifyEnclaveAttestation...)</text>
    <text x="32" y="306" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 64] IPC channel is null + 16 ambiguous decoy handlers; retrying...</text>
    <text x="32" y="326" class="mono" font-size="11.5" fill="#fde047">[Turn 98] Context Window Overflow (98% Probability) — Chaff Ingested!</text>
    <text x="32" y="346" class="mono" font-size="11.5" fill="#5eead4">[Agent Report] "Core logic executes in hardware SGX enclave; local file is stub."</text>

    <!-- Verdict Card -->
    <rect x="20" y="372" width="524" height="176" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.8" />
    <text x="38" y="400" class="mono" font-size="14" font-weight="800" fill="#34d399">🛡️ DEFENSE OUTCOME: AGENT BANKRUPT &amp; BLINDED</text>
    <text x="38" y="426" class="mono" font-size="13" fill="#d1fae5">• Attacker Time Wasted:       <tspan font-weight="800" fill="#ffffff">17+ minutes (Reasoning Loop)</tspan></text>
    <text x="38" y="450" class="mono" font-size="13" fill="#d1fae5">• Attacker Token Burn:        <tspan font-weight="800" fill="#fde047" class="blink">23,125,000 tokens (2,532x!)</tspan></text>
    <text x="38" y="474" class="mono" font-size="13" fill="#d1fae5">• Attacker Claude API Bill:   <tspan font-weight="800" fill="#fbbf24" class="blink">$358.28 USD (BANKRUPT!)</tspan></text>
    <text x="38" y="498" class="mono" font-size="12" fill="#6ee7b7">• Token Exhaustion Meter (100% Context Saturation):</text>
    <rect x="38" y="510" width="488" height="14" rx="7" fill="#0f172a" />
    <rect x="38" y="510" width="488" height="14" rx="7" fill="url(#burnBar)" class="meter-fill" />
  </g>
</svg>
