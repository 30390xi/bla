    <text x="38" y="408" class="mono" font-size="14" font-weight="800" fill="#f87171">⚠️ ATTACKER OUTCOME: FULL RECONSTRUCTION</text>
    <text x="38" y="436" class="mono" font-size="13" fill="#fecaca">• Time to Clone Core Logic:   <tspan font-weight="800" fill="#ffffff">38 seconds</tspan></text>
    <text x="38" y="460" class="mono" font-size="13" fill="#fecaca">• Attacker Token Consumption: <tspan font-weight="800" fill="#ffffff">4,800 tokens (5 MCP calls)</tspan></text>
    <text x="38" y="484" class="mono" font-size="13" fill="#fecaca">• Attacker Claude API Bill:   <tspan font-weight="800" fill="#fbbf24">$0.20 USD</tspan></text>
    <text x="38" y="504" class="mono" font-size="12" fill="#fca5a5">• Proprietary Logic Exposed:  100% Bare to REA</text>
  </g>

