<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .blink { animation: blinkAnim 1.2s infinite; }
      @keyframes blinkAnim {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="620" rx="16" fill="#020617" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header -->
  <text x="600" y="38" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#f8fafc">
    ⚔️ SIDE-BY-SIDE SHOWCASE: RUNNING <tspan fill="#f87171">morluto/rea</tspan> BEFORE vs. AFTER <tspan fill="#2dd4bf">npx bla-shield protect</tspan>
  </text>

  <!-- ==================== LEFT SCREEN: BEFORE BLA ==================== -->
  <g transform="translate(24, 58)">
    <rect width="564" height="538" rx="12" fill="url(#panelBg)" stroke="#ef4444" stroke-width="1.8" />
    <!-- Window Bar -->
