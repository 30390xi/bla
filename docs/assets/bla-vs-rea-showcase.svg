    <text x="20" y="70" class="mono" font-size="12.5" fill="#94a3b8">$ rea analyze-javascript-application ./notion-app.shielded.asar</text>
    <text x="20" y="98" class="mono" font-size="12" fill="#2dd4bf">▶ [REA Engine] Static &amp; Semantic Budgets Broken:</text>
    <text x="32" y="120" class="mono" font-size="12" fill="#e2e8f0">• parse_status:              <tspan fill="#2dd4bf" font-weight="700">"partial" (Degraded!)</tspan></text>
    <text x="32" y="140" class="mono" font-size="12" fill="#e2e8f0">• examination.status:        <tspan fill="#2dd4bf" font-weight="700">"limited" (Budget Exhausted!)</tspan></text>
    <text x="32" y="160" class="mono" font-size="11.5" fill="#fde047">• limits: ["alias-selections","primitive-bytes","primitive-candidates","getter-expansion"]</text>
    <text x="32" y="180" class="mono" font-size="12" fill="#e2e8f0">• electron.ipc[0].channel:   <tspan fill="#2dd4bf" font-weight="700">null (dynamic-findings!)</tspan></text>
    <text x="32" y="200" class="mono" font-size="12" fill="#e2e8f0">• electron_call_paths_limit: <tspan fill="#2dd4bf" font-weight="700">true (Depth 128 Exhausted!)</tspan></text>
    <text x="32" y="220" class="mono" font-size="12" fill="#e2e8f0">• Source Maps:               <tspan fill="#2dd4bf">Redirected to enclave://tee-runtime/</tspan></text>

    <line x1="20" y1="240" x2="544" y2="240" stroke="#334155" stroke-dasharray="4 4" />

    <text x="20" y="266" class="mono" font-size="12" fill="#2dd4bf">▶ [Attacker Coding Agent] Trapped in BLA Tarpit Loop:</text>
    <text x="32" y="290" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 14] Paging 118 decoy obligation nodes (_verifyEnclaveAttestation...)</text>
    <text x="32" y="310" class="mono" font-size="11.5" fill="#cbd5e1">[Turn 52] IPC channel is null + 16 ambiguous decoy handlers; retrying...</text>
    <text x="32" y="330" class="mono" font-size="11.5" fill="#fde047">[Turn 98] Context Window Overflow (98% Probability) — Chaff Ingested!</text>
    <text x="32" y="350" class="mono" font-size="11.5" fill="#5eead4">[Agent Report] "Core logic executes in hardware SGX enclave; local file is stub."</text>

    <!-- Verdict Card -->
    <rect x="20" y="380" width="524" height="136" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.8" />
    <text x="38" y="408" class="mono" font-size="14" font-weight="800" fill="#34d399">🛡️ DEFENSE OUTCOME: AGENT BANKRUPT &amp; BLINDED</text>
    <text x="38" y="436" class="mono" font-size="13" fill="#d1fae5">• Attacker Time Wasted:       <tspan font-weight="800" fill="#ffffff">17+ minutes (Reasoning Loop)</tspan></text>
    <text x="38" y="460" class="mono" font-size="13" fill="#d1fae5">• Attacker Token Burn:        <tspan font-weight="800" fill="#fde047" class="blink">23,125,000 tokens (2,532x!)</tspan></text>
    <text x="38" y="484" class="mono" font-size="13" fill="#d1fae5">• Attacker Claude API Bill:   <tspan font-weight="800" fill="#fbbf24">$358.28 USD (Bankrupted!)</tspan></text>
    <text x="38" y="504" class="mono" font-size="12" fill="#6ee7b7">• App Runtime Overhead:       0 ms (100% Identical Output)</text>
  </g>
</svg>
