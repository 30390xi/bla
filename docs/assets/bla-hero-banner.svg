<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#171026" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 900; fill: #f8fafc; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .pulse { animation: pulseAnim 2.8s infinite ease-in-out; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
  </g>

  <!-- Top Pill Badge -->
  <rect x="370" y="26" width="460" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="600" y="47" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#a5b4fc">
    ⚡ ADVERSARIAL DEFENSE SHIELD AGAINST AI REVERSE ENGINEERING
  </text>

  <!-- Main Title -->
  <text x="600" y="122" text-anchor="middle" class="title" font-size="56" letter-spacing="-1">
    BLA: <tspan fill="url(#shieldGrad)">Blind LLM Agents</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="162" text-anchor="middle" class="title" font-size="22" font-weight="600" fill="#94a3b8">
    Software is NOT done. It just learned how to fight back.
  </text>

  <!-- Duel Comparison Pill Box -->
  <!-- Left: REA -->
  <rect x="110" y="195" width="450" height="92" rx="12" fill="#1c1917" stroke="#7f1d1d" stroke-width="1.5" />
  <text x="135" y="225" class="mono" font-size="13" font-weight="700" fill="#f87171">THE SPEAR — REA (Reverse Engineer Anything)</text>
  <text x="135" y="255" class="mono" font-size="19" font-weight="700" fill="#fca5a5" text-decoration="line-through">
    Decompile  →  Understand  →  Recreate
  </text>
  <text x="135" y="276" class="mono" font-size="12" fill="#a8a29e">Extracts AST, IPC, WAT, .pyc &amp; native pseudocode via MCP</text>

  <!-- Center VS Badge -->
  <circle cx="600" cy="241" r="24" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)" />
  <text x="600" y="247" text-anchor="middle" class="title" font-size="16" fill="#38bdf8">VS</text>

  <!-- Right: BLA -->
  <rect x="640" y="195" width="450" height="92" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="2" class="pulse" />
  <text x="665" y="225" class="mono" font-size="13" font-weight="700" fill="#2dd4bf">THE SHIELD — BLA (Blind LLM Agents / Block Anything)</text>
  <text x="665" y="255" class="mono" font-size="19" font-weight="800" fill="url(#goldGrad)">
    Poison  →  Exhaust  →  Hallucinate
  </text>
  <text x="665" y="276" class="mono" font-size="12" fill="#99f6e4">Breaks REA semantic budgets, weaves tarpits &amp; bankrupts tokens</text>

  <!-- Bottom Command Bar -->
  <rect x="290" y="312" width="620" height="44" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
  <text x="600" y="340" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#e2e8f0">
    <tspan fill="#38bdf8">$</tspan> npx bla-shield audit ./dist &amp;&amp; npx bla-shield protect ./dist
  </text>
</svg>
