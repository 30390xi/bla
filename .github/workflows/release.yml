name: Release bla-agents

on:
  push:
    tags:
      - "bla-agents-*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true
        default: "1.1.0"
        type: string
      publish_npm:
        description: "Publish bla-agents to npm (requires NPM_TOKEN secret)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Publish Release (bla-agents)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full verification gates (typecheck, build, test, 8-target benchmark)
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run benchmark

      - name: Package bla-agents release artifact
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=bla-agents-$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets

          npm pack --pack-destination release-assets

          cd release-assets
          shasum -a 256 *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "bla-agents: v${VERSION}" \
              --generate-notes
          fi

      - name: Publish bla-agents to npm (if NPM_TOKEN is configured)
        if: ${{ (inputs.publish_npm != false) && env.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public
