name: Release bla-agents

on:
  push:
    branches:
      - main
    tags:
      - "bla-agents-*"
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Optional version bump before publishing (none | patch | minor | major)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-bla-agents
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Auto-Publish bla-agents to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optional version bump (on workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          node scripts/sync-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json src/identity.ts
          git commit -m "chore(release): bump bla-agents to v${VERSION}"
          git push origin HEAD:main

      - name: Check if current package.json version is already on npm
        id: check_npm
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view bla-agents version 2>/dev/null || echo "none")
          echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=bla-agents-$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full verification gates (typecheck, build, test, 8-target benchmark)
        if: steps.check_npm.outputs.should_publish == 'true'
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run benchmark

      - name: Package bla-agents release artifact
        if: steps.check_npm.outputs.should_publish == 'true'
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          shasum -a 256 *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        if: steps.check_npm.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_npm.outputs.tag }}
          VERSION: ${{ steps.check_npm.outputs.local_version }}
        run: |
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "bla-agents: v${VERSION}" \
              --generate-notes
          fi

      - name: Publish bla-agents to npm (Trusted Publishing OIDC or NPM_TOKEN)
        if: steps.check_npm.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          LOCAL_VERSION="${{ steps.check_npm.outputs.local_version }}"
          if npm view "bla-agents@${LOCAL_VERSION}" version >/dev/null 2>&1; then
            echo "bla-agents@${LOCAL_VERSION} is already published on npm."
          else
            npm publish --provenance --access public || npm publish --access public
          fi
