name: Release bla-agents

on:
  push:
    branches:
      - main
    tags:
      - "bla-agents-*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected release version (must match package.json after optional bump)"
        required: false
        default: ""
        type: string
      bump:
        description: "Optional version bump before publishing (none | patch | minor | major)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-bla-agents
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Auto-Publish bla-agents to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optional version bump (on workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && inputs.bump != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          node scripts/sync-version.mjs
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json src/identity.ts
          git commit -m "chore(release): bump bla-agents to v${VERSION}"
          git push origin HEAD:main

      - name: Verify version, trigger tag, and target tag commit consistency
        id: check_npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          HEAD_SHA=$(git rev-parse HEAD)
          TAG="bla-agents-${LOCAL_VERSION}"

          # 1. Verify workflow_dispatch version input matches manifest if provided
          if [ -n "${DISPATCH_VERSION}" ]; then
            NORM_DISPATCH="${DISPATCH_VERSION#v}"
            NORM_DISPATCH="${NORM_DISPATCH#bla-agents-}"
            if [ "${NORM_DISPATCH}" != "${LOCAL_VERSION}" ]; then
              echo "::error::workflow_dispatch version '${DISPATCH_VERSION}' does not match package.json version '${LOCAL_VERSION}'"
              exit 1
            fi
          fi

          # 2. Verify trigger tag matches manifest if triggered by refs/tags/*
          if [[ "${TRIGGER_REF}" == refs/tags/* ]]; then
            RAW_TAG="${TRIGGER_REF#refs/tags/}"
            if [[ "${RAW_TAG}" == bla-agents-* ]]; then
              TAG_VER="${RAW_TAG#bla-agents-}"
            elif [[ "${RAW_TAG}" == v* ]]; then
              TAG_VER="${RAW_TAG#v}"
            else
              echo "::error::Unsupported release tag format '${RAW_TAG}'"
              exit 1
            fi
            if [ "${TAG_VER}" != "${LOCAL_VERSION}" ]; then
              echo "::error::Trigger tag '${RAW_TAG}' does not match package.json version '${LOCAL_VERSION}'"
              exit 1
            fi
          fi

          PRIMARY_NPM_VERSION=$(npm view "bla-agents@${LOCAL_VERSION}" version 2>/dev/null || echo "none")
          echo "local_version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${LOCAL_VERSION}" != "${PRIMARY_NPM_VERSION}" ] && ! gh release view "${TAG}" >/dev/null 2>&1; then
            SHOULD_PUBLISH="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${TRIGGER_REF}" == refs/tags/* ]]; then
            SHOULD_PUBLISH="true"
          else
            SHOULD_PUBLISH="false"
            echo "bla-agents@${LOCAL_VERSION} release '${TAG}' already exists; skipping release on regular branch push."
          fi

          # 3. Verify existing remote/local tag points to current HEAD_SHA when publishing/releasing
          EXISTING_TAG_SHA=""
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
            EXISTING_TAG_SHA=$(git rev-list -n 1 "${TAG}")
          elif git rev-parse "${TAG}" >/dev/null 2>&1; then
            EXISTING_TAG_SHA=$(git rev-list -n 1 "${TAG}")
          fi
          echo "existing_tag_sha=${EXISTING_TAG_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${SHOULD_PUBLISH}" = "true" ] && [ -n "${EXISTING_TAG_SHA}" ] && [ "${EXISTING_TAG_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::Existing tag '${TAG}' points to ${EXISTING_TAG_SHA}, which differs from checkout commit ${HEAD_SHA}. Refusing cross-commit release."
            exit 1
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Run full verification gates (typecheck, build, test, 8-target benchmark)
        if: steps.check_npm.outputs.should_publish == 'true'
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run benchmark

      - name: Pack primary and alias release tarballs & verify consistency
        if: steps.check_npm.outputs.should_publish == 'true'
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGER_REF: ${{ github.ref }}
          HEAD_SHA: ${{ steps.check_npm.outputs.head_sha }}
          EXISTING_TAG_SHA: ${{ steps.check_npm.outputs.existing_tag_sha }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { BLA_IDENTITY } from "./dist/identity.js";
            import { packDualReleaseTarballs, verifyReleaseConsistency } from "./dist/core/release-plan.js";
            const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
            const packed = packDualReleaseTarballs(process.cwd(), "./release-assets");
            const plan = verifyReleaseConsistency({
              packageVersion: pkg.version,
              identityVersion: BLA_IDENTITY.version,
              dispatchVersion: process.env.DISPATCH_VERSION || null,
              triggerRef: process.env.TRIGGER_REF || null,
              headSha: process.env.HEAD_SHA,
              existingTagSha: process.env.EXISTING_TAG_SHA || null,
              tarballSha256: packed.primary.sha256,
              aliasTarballSha256: packed.alias.sha256,
            });
            console.log("Release plan verified:", JSON.stringify(plan, null, 2));
          '
          cat release-assets/SHA256SUMS.txt

      - name: Publish bla-agents tarball to npm
        if: steps.check_npm.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.check_npm.outputs.local_version }}
        run: |
          set -euo pipefail
          PRIMARY_TGZ="./release-assets/bla-agents-${VERSION}.tgz"

          if npm view "bla-agents@${VERSION}" version >/dev/null 2>&1; then
            echo "bla-agents@${VERSION} is already published on npm; skipping primary publish."
          elif [ -z "${NODE_AUTH_TOKEN:-}" ] || ! npm whoami >/dev/null 2>&1; then
            echo "::notice::Valid NPM_TOKEN not available in environment; skipping npm registry publish and proceeding to GitHub Release."
          else
            npm publish "${PRIMARY_TGZ}" --provenance --access public \
              || npm publish "${PRIMARY_TGZ}" --access public
          fi

      - name: Create or idempotently verify GitHub Release (no cross-commit clobber)
        if: steps.check_npm.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check_npm.outputs.tag }}
          VERSION: ${{ steps.check_npm.outputs.local_version }}
          HEAD_SHA: ${{ steps.check_npm.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$HEAD_SHA"
            git push origin "$TAG"
          else
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG points to $TAG_SHA instead of $HEAD_SHA"
              exit 1
            fi
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release '$TAG' already exists for verified tag commit $HEAD_SHA."
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --title "bla-agents: v${VERSION}" \
              --generate-notes
          fi
