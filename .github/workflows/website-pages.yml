name: Website Check

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

jobs:
  check-website:
    name: Verify website HTML, assets & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required pages and assets exist
        run: |
          for f in \
            website/index.html \
            website/get-started/index.html \
            website/showcase/index.html \
            website/guides/index.html \
            website/faq/index.html \
            website/assets/styles.css \
            website/assets/main.js \
            website/assets/home.js \
            website/assets/favicon.svg \
            website/assets/social-card.svg; do
            test -f "$f" || (echo "Missing required website file: $f" && exit 1)
          done
          echo "All website pages and assets verified."
